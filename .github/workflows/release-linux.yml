name: Linux binaries

# Builds fully static ascii-keyboard binaries (musl, no Swift or glibc needed)
# for x86_64 and aarch64.
#
# Releases are immutable in this repo: assets can't be added after publishing.
# So releasing is driven by pushing a tag (git tag v1.2.0 && git push origin v1.2.0):
# the binaries are attached to a draft release, which is then published.
# If you already created a draft for the tag (custom notes, a DMG), it is reused.
# On pull requests and manual runs the binaries are only kept as artifacts.

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # Swift toolchain and its matching Static Linux SDK (checksum from swift.org/install).
  SWIFT_IMAGE_SDK_URL: https://download.swift.org/swift-6.4.3-release/static-sdk/swift-6.4.3-RELEASE/swift-6.4.3-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
  SWIFT_SDK_CHECKSUM: 529e6982974de78793c8348c1459105a772f54b464a51edf074e5b9c4bfe7c73

jobs:
  build:
    runs-on: ubuntu-latest
    container: swift:6.4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install Static Linux SDK
        run: swift sdk install "$SWIFT_IMAGE_SDK_URL" --checksum "$SWIFT_SDK_CHECKSUM"
      - name: Build
        run: |
          mkdir -p dist
          for arch in x86_64 aarch64; do
            swift build -c release --product ascii-keyboard --swift-sdk "$arch-swift-linux-musl" -Xlinker -s
            bin="$(swift build -c release --product ascii-keyboard --swift-sdk "$arch-swift-linux-musl" --show-bin-path)/ascii-keyboard"
            stage="dist/ascii-keyboard-linux-$arch"
            mkdir -p "$stage"
            cp "$bin" LICENSE "$stage/"
            tar -C dist -czf "$stage.tar.gz" "ascii-keyboard-linux-$arch"
          done
          cd dist && sha256sum *.tar.gz > SHA256SUMS
      - name: Smoke test (x86_64)
        run: dist/ascii-keyboard-linux-x86_64/ascii-keyboard -f slant "ok"
      - uses: actions/upload-artifact@v4
        with:
          name: ascii-keyboard-linux
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ascii-keyboard-linux
          path: dist
      - name: Attach to a draft release, then publish
        run: |
          state=$(gh release view "$TAG" --json isDraft -q 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo missing)
          case "$state" in
            missing)
              gh release create "$TAG" --draft --verify-tag --generate-notes --title "$TAG" dist/*.tar.gz dist/SHA256SUMS ;;
            draft)
              gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber ;;
            published)
              echo "::error::$TAG is already published; immutable releases can't take new assets. Release a new tag instead."
              exit 1 ;;
          esac
          gh release edit "$TAG" --draft=false --latest
